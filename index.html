try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&saved.v===4&&Number.isSafeInteger(saved.initial)&&saved.initial>=0&&Array.isArray(saved.ops)&&saved.ops.length===2&&saved.ops.every(o=>typeof o.id==='string'&&/^2026-\d{2}-\d{2}$/.test(o.date)&&Number.isSafeInteger(o.amount))){state={...defaults(),...saved};if(![14,30].includes(state.horizon))state.horizon=14;if(!state.draft)state.draft=defaults().draft;if(!Array.isArray(state.chat))state.chat=[]}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify({...state,v:4}))}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}
function events(config=null){
  const a=structuredClone(state.ops);
  const supplier=a.find(x=>x.id==='supplier');
  const client=a.find(x=>x.id==='client');
  if(config?.type==='B'&&supplier){
    // Never allow a transfer larger than the supplier obligation.
    const shift=clamp(Math.round(Number(config.shift)||0),0,Math.abs(supplier.amount));
    const shiftDate=typeof config.shiftDate==='string'&&/^2026-\d{2}-\d{2}$/.test(config.shiftDate)&&day(config.shiftDate)>=day(client.date)&&day(config.shiftDate)<=day(FORECAST_END)?config.shiftDate:client.date;
    if(shift>0){
      supplier.amount+=shift;
      supplier.name='Платёж поставщику · первая часть';
      a.push({id:'deferred',date:shiftDate,name:'Отложенная часть платежа поставщику',note:'Требует согласования с поставщиком',amount:-shift,kind:'deferred'});
    }
  }
  if(config?.type==='C'&&client){
    const requested=typeof config.accelerateDate==='string'&&/^2026-\d{2}-\d{2}$/.test(config.accelerateDate)?config.accelerateDate:'';
    const safeDate=requested&&day(requested)>day(START)&&day(requested)<day(supplier.date)?requested:iso(day(supplier.date)-1);
    client.date=safeDate;
    client.name='Поступление от клиента · ускоренный сценарий';
  }
  return a.filter(x=>x.amount!==0).sort((x,y)=>x.date.localeCompare(y.date)||(Number(y.amount>0)-Number(x.amount>0))||(y.amount-x.amount));
}
function calculate(config=null,horizon=state.horizon){const safeHorizon=[14,30].includes(Number(horizon))?Number(horizon):14,ev=events(config),rows=[];let bal=state.initial;for(let i=0;i<safeHorizon;i++){const dt=iso(day(START)+i),ops=ev.filter(o=>o.date===dt);/* Daily forecast treats incoming cash as available before outflows on the same date. */const ins=ops.filter(o=>o.amount>0).reduce((sum,o)=>sum+o.amount,0),outs=-ops.filter(o=>o.amount<0).reduce((sum,o)=>sum+o.amount,0);bal+=ins-outs;rows.push({date:dt,balance:bal,incoming:ins,outgoing:outs,ops});}const min=Math.min(...rows.map(r=>r.balance)),mr=rows.find(r=>r.balance===min),firstRisk=rows.find(r=>r.balance<0),underReserve=rows.find(r=>r.balance<state.reserve);return{rows,events:ev,min,minDate:mr.date,firstRisk,underReserve,last:bal,incoming:rows.reduce((sum,r)=>sum+r.incoming,0),outgoing:rows.reduce((sum,r)=>sum+r.outgoing,0),negativeDays:rows.filter(r=>r.balance<0).length,level:min<0?'red':min<state.reserve?'amber':'green',outside:ev.filter(o=>day(o.date)>=day(START)+safeHorizon)}}
function activeConfig(){return state.plan?state.plan:null}
function current(){return calculate(activeConfig())}
function badge(p){return `<span class="pill ${p.level}"><i class="dot"></i>${p.level==='red'?'Высокий риск':p.level==='amber'?'Ниже резерва':'Резерв сохранён'}</span>`}
function footer(){return `<div class="footer"><span><strong>ВТБ.Оракул</strong> · концепция для «Академии Финтеха»</span><span>Демо-данные · не официальный сервис ВТБ · реальные платежи не выполняются</span></div>`}
function pagehead(title,sub){return `<div class="head"><div><div class="kicker">ВТБ.ОРАКУЛ · ПРОГНОЗ ДЕНЕЖНЫХ ПОТОКОВ</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions"><button class="btn secondary" data-action="settings">⚙ Исходные данные</button><button class="btn secondary" data-action="export">↓ Экспорт CSV</button></div></div>`}
function planNotice(){return state.plan?`<div class="active-plan"><span>✓ Сценарий сохранён для проверки · ${state.plan.type==='B'?'перенос части платежа':state.plan.type==='C'?'ускорение поступления':'исходный план'} · фактические операции не выполняются</span><button class="btn tertiary small" data-action="remove-plan">Сбросить выбранный план</button></div>`:''}
function viewTabs(){return state.plan?`<div class="tabs"><button data-view="base" class="${state.view==='base'?'active':''}">Исходный</button><button data-view="active" class="${state.view==='active'?'active':''}">Выбранный сценарий</button></div>`:`<span class="pill blue">${state.horizon} дней · до ${date(iso(day(START)+state.horizon-1))}</span>`}
function shown(){return state.view==='base'?calculate():current()}
function metricCards(p){return `<div class="grid metrics">
<section class="metric"><div class="metric-top">Текущий остаток <span class="metric-icon">◉</span></div><div class="metric-value">${money(state.initial)}</div><div class="metric-caption">На начало 24 октября 2026</div></section>
<section class="metric"><div class="metric-top">Минимальный остаток <span class="metric-icon">⌁</span></div><div class="metric-value ${p.level==='red'?'negative':p.level==='amber'?'warn':'positive'}">${signed(p.min)}</div><div class="metric-caption">${date(p.minDate,true)} · ${p.level==='red'?'прогнозируемый дефицит':p.level==='amber'?'ниже резерва '+money(state.reserve):'резерв сохранён'}</div></section>
<section class="metric"><div class="metric-top">Ожидаемые поступления <span class="metric-icon">↓</span></div><div class="metric-value positive">${money(p.incoming)}</div><div class="metric-caption">На выбранном горизонте · дата не подтверждена</div></section>
<section class="metric"><div class="metric-top">Планируемые платежи <span class="metric-icon">↑</span></div><div class="metric-value">${money(p.outgoing)}</div><div class="metric-caption">Включая обязательство поставщику</div></section></div>`}
function chart(p,compare=null){const id='chart'+(++chartCount),W=760,H=250,L=66,R=15,T=15,B=32,iw=W-L-R,ih=H-T-B,all=[...p.rows.map(r=>r.balance),...(compare?compare.rows.map(r=>r.balance):[]),0,state.reserve];let lo=Math.min(...all),hi=Math.max(...all);const stepRaw=Math.max((hi-lo)/4,50000),mag=10**Math.floor(Math.log10(stepRaw)),step=[1,2,5,10].map(n=>n*mag).find(n=>n>=stepRaw);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;const x=i=>L+i*iw/Math.max(1,p.rows.length-1),y=v=>T+(hi-v)/(hi-lo)*ih,zero=y(0);let grid='';for(let v=lo;v<=hi;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#d8a9b0':'#edf1f7'}" stroke-dasharray="${v===0?'4 4':'0'}"/><text x="${L-9}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8795a9">${Math.round(v/100000)/10}м</text>`}const line=rows=>rows.map((r,i)=>(i?'L':'M')+x(i)+' '+y(r.balance)).join(' ');const ticks=[0,Math.round((p.rows.length-1)*.25),Math.round((p.rows.length-1)*.5),Math.round((p.rows.length-1)*.75),p.rows.length-1];const labels=[...new Set(ticks)].map(i=>`<text x="${x(i)}" y="${H-9}" font-size="10" text-anchor="${i===0?'start':i===p.rows.length-1?'end':'middle'}" fill="#8795a9">${date(p.rows[i].date)}</text>`).join('');const dots=p.rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.balance)}" r="${r.ops.length?4:2}" fill="${r.balance<0?'#b52f3b':'#1765d8'}" stroke="#fff" stroke-width="1.5"><title>${date(r.date,true)} · ${signed(r.balance)}</title></circle>`).join('');return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогноз остатка по дням">${grid}<line x1="${L}" x2="${W-R}" y1="${y(state.reserve)}" y2="${y(state.reserve)}" stroke="#a4b1c4" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(state.reserve)-6}" text-anchor="end" font-size="9" fill="#8493a9">Резерв ${money(state.reserve)}</text>${compare?`<path d="${line(compare.rows)}" fill="none" stroke="#9ba8ba" stroke-width="2" stroke-dasharray="5 5"/>`:''}<path d="${line(p.rows)}" fill="none" stroke="#1765d8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg></div>`}
function legend(compare=false){return `<div class="legend"><span><i class="linekey"></i>${compare?'Выбранный сценарий':'Прогноз остатка'}</span>${compare?'<span><i class="linekey dashed"></i>Исходный сценарий</span>':''}<span><i class="linekey dashed"></i>Неснижаемый резерв</span><span><i class="linekey red"></i>Отрицательный остаток</span></div>`}
function riskBanner(p){
const supplier=p.events.find(o=>o.id==='supplier')||state.ops.find(o=>o.id==='supplier');
const client=p.events.find(o=>o.id==='client')||state.ops.find(o=>o.id==='client');
let title,body,kind;
if(p.level==='red'){title=`Возможен кассовый разрыв ${date(p.firstRisk?.date||p.minDate,true)}`;body=`Минимальный остаток ${signed(p.min)}. Платёж поставщику ${money(Math.abs(supplier.amount))} приходится на ${date(supplier.date,true)}, а поступление ${money(client.amount)} ожидается ${date(client.date,true)} и пока не подтверждено.`;kind='red'}
else if(p.level==='amber'){title=`Остаток опустится ниже условного резерва ${money(state.reserve)}`;body=`Минимальный остаток ${signed(p.min)} ${date(p.minDate,true)}. По расчёту отрицательного остатка нет, но запас ликвидности меньше демонстрационного порога.`;kind='amber'}
else{title='В выбранном сценарии условный резерв сохраняется';body=`Минимальный остаток ${signed(p.min)} ${date(p.minDate,true)}. Результат зависит от допущения, что ожидаемое поступление произойдёт в указанную дату.`;kind='green'}

function opsTable(p){const all=p.events.filter(o=>day(o.date)<day(START)+state.horizon&&day(o.date)>day(START));const visible=state.filter==='in'?all.filter(o=>o.amount>0):state.filter==='out'?all.filter(o=>o.amount<0):all;const running={};let balance=state.initial;for(let i=0;i<state.horizon;i++){const dt=iso(day(START)+i),dayOps=all.filter(o=>o.date===dt).sort((a,b)=>(Number(b.amount>0)-Number(a.amount>0))||(b.amount-a.amount));for(const o of dayOps){balance+=o.amount;running[o.id+'|'+o.date]=balance;}}return `<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Операция</th><th>Условие</th><th>Сумма</th><th>Остаток после операции</th></tr></thead><tbody>${visible.map(o=>{const bal=running[o.id+'|'+o.date]??p.rows.find(r=>r.date===o.date)?.balance??state.initial;return `<tr><td>${date(o.date,true)}</td><td><strong>${esc(o.name)}</strong><div class="muted" style="font-size:10px">${esc(o.note||'Демонстрационная операция')}</div></td><td>${o.kind==='uncertain'?'<span class="pill amber">Не подтверждено</span>':o.kind==='deferred'?'<span class="pill blue">Сценарий</span>':o.amount>0?'<span class="pill green">Поступление</span>':'<span class="pill blue">Платёж</span>'}</td><td class="amt ${o.amount>0?'positive':o.amount<0?'negative':''}">${signed(o.amount)}</td><td class="amt ${bal<0?'negative':bal<state.reserve?'warn':''}">${signed(bal)}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Нет операций на выбранном периоде.</td></tr>'}</tbody></table></div>`}
function home(){const p=shown();return pagehead('Финансы под контролем','От текущего остатка — к прогнозу, объяснению риска и следующему действию.')+planNotice()+metricCards(p)+`<div class="grid cols"><section class="card"><div class="card-head"><div><h2>Прогноз остатка</h2><p>${state.plan?.type==='B'?'Выбранный сценарий B: поступление клиента учитывается до списания перенесённой части.':state.plan?.type==='C'?'Выбранный сценарий C: поступление клиента моделируется раньше срока платежа.':'В исходном сценарии платёж поставщику предшествует ожидаемому поступлению клиента.'}</p></div>${viewTabs()}</div>${legend()}${chart(p)}<div class="summary-row"><div><span>Минимальный остаток</span><strong class="${p.min<0?'negative':p.min<state.reserve?'warn':'positive'}">${signed(p.min)}</strong></div><div><span>Первый дефицит</span><strong>${p.firstRisk?date(p.firstRisk.date,true):'Не выявлен'}</strong></div><div><span>На конец периода</span><strong>${signed(p.last)}</strong></div></div>${riskBanner(p)}</section><div class="stack"><section class="card"><div class="card-head"><h2>Ближайшие операции</h2><button class="subtle-link" data-nav="forecast">Все операции →</button></div><div class="quick-list">${p.events.filter(o=>day(o.date)>day(START)).slice(0,4).map(o=>`<div class="quick-item"><div class="op-icon ${o.amount>0?'in':''}">${o.amount>0?'↓':'↑'}</div><div><div class="quick-name">${esc(o.name)}</div><div class="quick-meta">${date(o.date,true)} · ${o.kind==='uncertain'?'дата не подтверждена':o.amount>0?'поступление':'платёж'}</div></div><div class="quick-amount ${o.amount>0?'in':'negative'}">${signed(o.amount)}</div></div>`).join('')}</div></section><section class="card helper-card"><div class="helper-head"><div class="orb">✳</div><div><h2>Оракул подскажет</h2><p>Объяснение на основе финансового расчёта</p></div></div><h3>${p.level==='red'?'Есть время снизить риск':p.level==='amber'?'Сохраните запас ликвидности':'Проверьте неопределённость'}</h3><p>${p.level==='red'?`Платёж ${money(Math.abs(state.ops.find(o=>o.id==='supplier').amount))} приходится на ${date(state.ops.find(o=>o.id==='supplier').date,true)}, а ${money(state.ops.find(o=>o.id==='client').amount)} от клиента ожидаются ${date(state.ops.find(o=>o.id==='client').date,true)}. Сравните перенос части платежа или более раннее поступление.`:'Проверьте, насколько прогноз зависит от срока клиентской оплаты.'}</p><button class="btn" style="width:100%;margin-top:14px" data-nav="scenarios">Сравнить сценарии →</button></section></div></div><section class="card table-card"><div class="card-head"><div><h2>Календарь операций</h2><p>Исходные суммы и даты, учтённые в прогнозе</p></div><div class="filterbar"><button class="${state.filter==='all'?'active':''}" data-filter="all">Все</button><button class="${state.filter==='in'?'active':''}" data-filter="in">Поступления</button><button class="${state.filter==='out'?'active':''}" data-filter="out">Платежи</button></div></div>${opsTable(p)}</section>${footer()}`}
function riskDetails(p){const supplier=state.ops.find(o=>o.id==='supplier'),client=state.ops.find(o=>o.id==='client'),plan=state.plan,isB=plan?.type==='B'&&p.events.some(o=>o.id==='deferred'),isC=plan?.type==='C';const title1=isB?'Платёж поставщику · разделён на две части':'Платёж поставщику · '+money(Math.abs(supplier.amount));const text1=isB?`${date(supplier.date,true)} оплачивается ${money(Math.max(0,Math.abs(supplier.amount)-plan.shift))}; оставшиеся ${money(plan.shift)} переносятся на ${date(plan.shiftDate,true)} после поступления клиента. Перенос требует согласования.`:isC?`Срок платежа — ${date(supplier.date,true)}. В выбранном сценарии поступление моделируется раньше.`:`${date(supplier.date,true)} · срок оплаты предшествует поступлению.`;const clientDate=isC?(plan?.accelerateDate||state.draft.accelerateDate):client.date;const text3=p.level==='green'?(isB?'После поступления клиента перенесённая часть списывается; расчётный минимум положительный.':isC?'Ускоренное поступление позволяет покрыть платёж в демонстрационном сценарии.':'В выбранном сценарии отрицательного остатка нет.'):(p.level==='amber'?'Отрицательного остатка нет, но минимум ниже условного резерва.':'При оплате до поступления возникает временный дефицит.');return `<div class="cause"><span class="cause-num">1</span><div><strong>${title1}</strong><p>${text1}</p></div></div><div class="cause"><span class="cause-num">2</span><div><strong>Поступление от клиента · ${money(client.amount)}</strong><p>${date(clientDate,true)} · ${isC?'ускорение требует согласия клиента.':'дата не подтверждена.'}</p></div></div><div class="cause"><span class="cause-num">3</span><div><strong>Начальный остаток · ${money(state.initial)}</strong><p>${text3}</p></div></div>`}
function forecast(){const p=shown();return pagehead('Прогноз денежных потоков','Проверьте, когда возникает дефицит, и сверьте исходные данные.')+planNotice()+`<div class="grid forecast-grid"><section class="card"><div class="card-head"><div><h2>Остаток по дням</h2><p>Период считается от 24 октября 2026 · даты демонстрационные</p></div><div class="tabs"><button class="${state.horizon===14?'active':''}" data-horizon="14">14 дней</button><button class="${state.horizon===30?'active':''}" data-horizon="30">30 дней</button></div></div>${legend()}${chart(p)}<div class="summary-row"><div><span>Минимум</span><strong class="${p.min<0?'negative':p.min<state.reserve?'warn':'positive'}">${signed(p.min)}</strong></div><div><span>Первый дефицит</span><strong>${p.firstRisk?date(p.firstRisk.date,true):'Не выявлен'}</strong></div><div><span>Остаток в конце</span><strong>${signed(p.last)}</strong></div></div><details class="disclosure"><summary>Как считается прогноз</summary><p>Остаток на конец дня = предыдущий остаток + поступления − платежи. Даты и суммы берутся из демонстрационных операций. Дата клиентского поступления не подтверждена; модель не оценивает вероятность оплаты. График показывает остаток на конец дня; таблица показывает последовательный остаток после каждой операции. Для операций одной даты в демонстрационном сценарии поступления учитываются до списаний. Даты в сценарии условные.</p></details></section><aside class="card"><div class="card-head"><h2>${p.level==='green'?'Что влияет на прогноз':'Причины риска'}</h2>${badge(p)}</div><div class="risk-number ${p.min<0?'negative':p.min<state.reserve?'warn':'positive'}">${signed(p.min)}</div><div class="muted" style="font-size:11px">Минимальный остаток · ${date(p.minDate,true)}</div>${riskDetails(p)}<button class="btn" style="width:100%;margin-top:16px" data-nav="scenarios">Проверить варианты →</button></aside></div><section class="card table-card"><div class="card-head"><h2>Операции и остаток после каждой операции</h2><span c ath.abs(state.ops.find(o=>o.id==='supplier').amount))}"><small>От 0 до 1 500 000 ₽</small></div><div class="field"><label for="shift-date">Дата перенесённой части (не раньше поступления)</label><input id="shift-date" type="date" min="${state.ops.find(o=>o.id==='client').date}" max="${FORECAST_END}" value="${state.draft.shiftDate}"><small>Необходимо согласовать с поставщиком. Перенос не выполняется автоматически.</small></div></div><div><h3 style="font-size:12px;margin-bottom:4px">Сценарий C · ускорение поступления</h3><p class="muted small">Поступление моделируется раньше, только если клиент согласится.</p><div class="field"><label for="accelerate-date">Предполагаемая дата поступления</label><input id="accelerate-date" type="date" min="2026-10-25" max="${iso(day(state.ops.find(o=>o.id==='supplier').date)-1)}" value="${state.draft.accelerateDate}"><small>Исходная дата — ${date(state.ops.find(o=>o.id==='client').date,true)}. Сумма поступления не меняется.</small></div><div class="scenario-outcome" id="scenario-summary">${summaryText(sel)}</div></div></div><div class="plan-bar"><div><strong>Зафиксировать следующий шаг</strong><p>Сохранение обновит главную и прогноз. Реальные платежи не выполняются.</p></div><button class="btn" data-action="confirm-plan">Выбрать этот сценарий →</button></div></section>${footer()}`}

ive':p.min<state.reserve?'warn':'positive'}">${signed(p.min)}</strong></div><div class="context-row"><span class="muted">Сценарий</span><strong>${state.plan?(state.plan.type==='B'?'Перенос платежа':state.plan.type==='C'?'Ускорение поступления':'Без изменений'):'Исходный'}</strong></div><button class="btn secondary" style="width:100%;margin-top:15px" data-nav="forecast">Открыть подробный прогноз →</button></section><section class="card helper-card"><div class="helper-head"><div class="orb">✓</div><div><h2>Что проверить до решения</h2><p>Ограничения, которых нет в модели</p></div></div><p>Согласие поставщика или клиента, договорные сроки, штрафы и влияние на операционную деятельность. Не переносите обязательство автоматически.</p><button class="btn" style="width:100%;margin-top:14px" data-nav="scenarios">Вернуться к сценариям →</button></section></aside></div>${footer()}`}
function respond(q){
const low=q.toLowerCase(),p=shown(),supplier=state.ops.find(o=>o.id==='supplier'),client=state.ops.find(o=>o.id==='client');let ans;
if(/почему|причин|риск|дефиц/.test(low)){
ans=`Риск возникает из-за несовпадения сроков: на ${date(supplier.date,true)} запланирован платёж поставщику ${money(Math.abs(supplier.amount))}, а начальный остаток составляет ${money(state.initial)}. После платежа остаток станет ${signed(state.initial+supplier.amount)}. Поступление ${money(client.amount)} ожидается ${date(client.date,true)}, но дата не подтверждена. Это сценарный прогноз, а не гарантия.`
}else if(/перенос|платеж|платёж|поставщик/.test(low)){

}else if(/раньше|ускор|клиент|поступлен/.test(low)){
const c=scenarioResult('C');ans=`В сценарии C поступление ${money(client.amount)} моделируется на ${date(state.draft.accelerateDate,true)} вместо ${date(client.date,true)}. Минимальный остаток: ${signed(c.min)} ${date(c.minDate,true)}. Результат возможен только если клиент согласится на раннюю оплату.`
}else if(/услов|провер|договор|огранич/.test(low)){
ans='Перед выбором сценария проверьте договорные сроки, возможные штрафы, согласие контрагента и операционные последствия. Модель не выполняет платежи, не связывается с клиентом или поставщиком и не учитывает комиссии, штрафы и влияние на продажи.'
}else{

}
state.chat.push({role:'user',text:q},{role:'ai',text:ans});state.chat=state.chat.slice(-20);save();render();const body=$('#chat-body');if(body)body.scrollTop=body.scrollHeight
}
function openSettings(){const ops=state.ops,supplier=ops.find(o=>o.id==='supplier'),client=ops.find(o=>o.id==='client');const nextDay=iso(day(supplier.date)+1);$('#modal-content').innerHTML=`<h2 id="modal-title">Исходные данные</h2><p>Изменения пересчитывают все четыре экрана. Все значения остаются демонстрационными.</p><div class="setting-grid"><div class="setting"><label for="set-initial">Начальный остаток, ₽</label><input id="set-initial" type="number" min="0" max="100000000" step="50000" value="${state.initial}"><small>На 24 октября 2026</small></div><div class="setting"><label for="set-reserve">Условный резерв, ₽</label><input id="set-reserve" type="number" min="0" max="100000000" step="50000" value="${state.reserve}"><small>Условный порог для демонстрации</small></div><div class="setting"><label for="set-supplier-date">Дата платежа поставщику</label><input id="set-supplier-date" type="date" min="2026-10-25" max="2026-11-21" value="${supplier.date}"><small>В пределах 30-дневного горизонта</small></div><div class="setting"><label for="set-supplier-amount">Платёж поставщику, ₽</label><input id="set-supplier-amount" type="number" min="1" max="100000000" step="50000" value="${-supplier.amount}"></div><div class="setting"><label for="set-client-date">Ожидаемая дата поступления</label><input id="set-client-date" type="date" min="${nextDay}" max="${FORECAST_END}" value="${client.date}"><small>Можно выбрать октябрь или ноябрь, но дата должна быть позже платежа</small></div><div class="setting"><label for="set-client-amount">Поступление от клиента, ₽</label><input id="set-client-amount" type="number" min="1" max="100000000" step="50000" value="${client.amount}"></div></div><div class="modal-actions"><button class="btn tertiary" data-action="close-modal">Отмена</button><button class="btn" data-action="save-settings">Применить и пересчитать</button></div>`;const sd=$('#set-supplier-date'),cd=$('#set-client-date');sd.addEventListener('change',()=>{const minDate=iso(day(sd.value)+1);cd.min=minDate;if(!cd.value||day(cd.value)<=day(sd.value))cd.value=minDate;if(day(cd.value)>day(FORECAST_END))cd.value=FORECAST_END;});$('#modal').classList.add('open');$('#set-initial').focus()}
function exportCSV(){const p=shown(),rows=[['Дата','Остаток на начало дня','Поступления','Платежи','Остаток на конец дня','Статус','Операции'],...p.rows.map((r,i)=>{const opening=i===0?state.initial:p.rows[i-1].balance;const status=r.balance<0?'Дефицит':r.balance<state.reserve?'Ниже резерва':'Резерв сохранён';return [r.date,opening,r.incoming,r.outgoing,r.balance,status,r.ops.map(o=>o.name).join(', ')||'Нет операций']})];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='VTB_Orakul_forecast.csv';a.click();URL.revokeObjectURL(url);toast('Дневной прогноз экспортирован в CSV.')}
function choose(type){state.draft.type=type;render();toast('Сценарий выбран для сравнения.')}
function savePlan(){const type=state.draft.type||'B';const cfg=type==='A'?{type:'A',shift:0,shiftDate:state.draft.shiftDate,accelerateDate:state.draft.accelerateDate}:type==='B'?{type:'B',shift:state.draft.shift,shiftDate:state.draft.shiftDate,accelerateDate:state.draft.accelerateDate}:{type:'C',shift:0,shiftDate:state.draft.shiftDate,accelerateDate:state.draft.accelerateDate};calculate(cfg);$('#modal-content').innerHTML=`<h2 id="modal-title">Подтвердить следующий шаг</h2><p>Вы не запускаете платёж. Вы фиксируете выбранный сценарий и допущение для дальнейшей проверки.</p><div class="scenario-outcome">${summaryText(type)}</div><div style="margin-top:15px;font-size:12px"><label style="display:flex;align-items:flex-start;gap:9px"><input type="checkbox" id="confirm-condition" style="margin-top:3px"> Я понимаю, что перенос платежа или ускорение поступления требует согласия контрагента и не выполнено автоматически.</label></div><div class="modal-actions"><button class="btn tertiary" data-action="close-modal">Вернуться</button><button class="btn" data-action="save-plan-final" disabled>Подтвердить выбор</button></div>`;$('#modal').classList.add('open');const check=$('#confirm-condition'),confirmButton=$('[data-action="save-plan-final"]'),backButton=$('[data-action="close-modal"]');check.addEventListener('change',()=>{confirmButton.disabled=!check.checked});confirmButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(!check.checked){toast('Сначала подтвердите согласие с условиями.');return}action('save-plan-final')});backButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();action('close-modal')})}
function applySettings(){const initial=Number($('#set-initial').value),reserve=Number($('#set-reserve').value),sa=Number($('#set-supplier-amount').value),ca=Number($('#set-client-amount').value),sd=$('#set-supplier-date').value,cd=$('#set-client-date').value;const amounts=[initial,reserve,sa,ca];if(!amounts.every(Number.isSafeInteger)||initial<0||reserve<0||sa<=0||ca<=0||amounts.some(n=>n>100000000)||!sd||!cd||day(sd)<=day(START)||day(sd)>day(FORECAST_END)||day(cd)<=day(sd)||day(cd)>day(FORECAST_END)){toast('Проверьте суммы и даты: поступление должно быть позже платежа, а обе даты — в пределах прогноза до 22 ноября 2026.');return}state.initial=initial;state.reserve=reserve;state.ops.find(o=>o.id==='supplier').amount=-sa;state.ops.find(o=>o.id==='supplier').date=sd;state.ops.find(o=>o.id==='client').amount=ca;state.ops.find(o=>o.id==='client').date=cd;state.draft.shift=Math.min(Math.max(0,Number(state.draft.shift)||0),sa);if(!state.draft.shiftDate||day(state.draft.shiftDate)<day(cd))state.draft.shiftDate=cd;if(!state.draft.accelerateDate||day(state.draft.accelerateDate)>=day(sd)||day(state.draft.accelerateDate)<=day(START))state.draft.accelerateDate=iso(day(sd)-1);state.plan=null;state.view='active';state.draft.type='B';save();$('#modal').classList.remove('open');render();toast('Исходные данные обновлены на всех экранах.')}
function render(){chartCount=0;const nav=NAV.map(([id,ic,label])=>`<button data-screen="${id}" class="${state.screen===id?'active':''}" ${state.screen===id?'aria-current="page"':''}><span class="ic">${ic}</span>${label}</button>`).join('');$('#desktop-nav').innerHTML=nav;$('#mobile-nav').innerHTML=nav;$('#main').innerHTML=({home,forecast,scenarios,assistant}[state.screen])();bind();save()}
function bind(){ $$('[data-screen]').forEach(b=>b.onclick=()=>go(b.dataset.screen));$$('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$$('[data-horizon]').forEach(b=>b.onclick=()=>{state.horizon=Number(b.dataset.horizon);render()});$$('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});$$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$$('[data-select-scenario]').forEach(b=>b.onclick=()=>choose(b.dataset.selectScenario));$$('[data-question]').forEach(b=>b.onclick=()=>respond(b.dataset.question));if ($('#shift')) {
  const supplierAmount = Math.abs(state.ops.find(o => o.id === 'supplier').amount);
  const shiftInput = $('#shift');
  const shiftRange = $('#shift-range');
  const shiftDate = $('#shift-date');
  const accelerateDate = $('#accelerate-date');

  // Ограничиваем перенос фактической суммой платежа поставщику.
  shiftInput.max = supplierAmount;
  shiftRange.max = supplierAmount;

  const updateShift = value => {
    const amount = clamp(Math.round(Number(value) || 0), 0, supplierAmount);
    state.draft.shift = amount;
    shiftInput.value = amount;
    shiftRange.value = amount;
    state.draft.type = 'B';
    refreshScenarioResults();
  };

  shiftInput.oninput = e => updateShift(e.target.value);
  shiftRange.oninput = e => updateShift(e.target.value);

  shiftDate.max = FORECAST_END;
  shiftDate.onchange = e => {
    const clientDate = state.ops.find(o => o.id === 'client').date;
    const selectedDate = e.target.value;
    state.draft.shiftDate = !selectedDate || day(selectedDate) < day(clientDate) || day(selectedDate) > day(FORECAST_END)
      ? clientDate
      : selectedDate;
    state.draft.type = 'B';
    refreshScenarioResults();
  };

  accelerateDate.onchange = e => {
    const supplierDate = state.ops.find(o => o.id === 'supplier').date;
    const selectedDate = e.target.value;
    state.draft.accelerateDate = !selectedDate || day(selectedDate) <= day(START) || day(selectedDate) >= day(supplierDate)
      ? iso(day(supplierDate) - 1)
      : selectedDate;
    state.draft.type = 'C';
    refreshScenarioResults();
  };
}if($('#chat-form'))$('#chat-form').onsubmit=e=>{e.preventDefault();const q=$('#question').value.trim();if(q)respond(q)}}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function refreshScenarioResults(){const activeEl=document.activeElement,activeId=activeEl&&activeEl.id;let selStart=null,selEnd=null;try{selStart=activeEl.selectionStart;selEnd=activeEl.selectionEnd}catch(e){}const y=window.scrollY;$('#main').innerHTML=({home,forecast,scenarios,assistant}[state.screen])();bind();const next=activeId?$('#'+activeId):null;if(next){next.focus({preventScroll:true});try{if(selStart!==null&&selEnd!==null)next.setSelectionRange(selStart,selEnd)}catch(e){}}window.scrollTo(0,y)}
function go(page){state.screen=page;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function action(a){if(a==='settings')openSettings();if(a==='export')exportCSV();if(a==='close-modal')$('#modal').classList.remove('open');if(a==='save-settings')applySettings();if(a==='confirm-plan')savePlan();if(a==='remove-plan'){state.plan=null;state.view='active';save();render();toast('Выбранный план сброшен. Исходный прогноз сохранён.')}if(a==='save-plan-final'){const t=state.draft.type||'B';state.plan=t==='A'?{type:'A',shift:0,shiftDate:state.draft.shiftDate,accelerateDate:state.draft.accelerateDate}:t==='B'?{type:'B',shift:state.draft.shift,shiftDate:state.draft.shiftDate,accelerateDate:state.draft.accelerateDate}:{type:'C',shift:0,shiftDate:state.draft.shiftDate,accelerateDate:state.draft.accelerateDate};state.view='active';state.screen='home';save();$('#modal').classList.remove('open');render();toast('План сохранён для дальнейшей проверки. Ни один платёж не выполнен.')}}
$('#modal').addEventListener('click',e=>{const actionButton=e.target.closest('[data-action]');if(actionButton&&$('#modal').contains(actionButton)){e.preventDefault();action(actionButton.dataset.action);return}if(e.target.id==='modal')$('#modal').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')});render();
</script>
</body></html>

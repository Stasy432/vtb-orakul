<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВТБ.Оракул — UX/UI прототип</title>
<style>
:root{--navy:#0b2b59;--blue:#1769e0;--blue2:#eaf2ff;--ink:#172b4d;--muted:#6c7b91;--line:#e3eaf3;--bg:#f4f7fb;--white:#fff;--green:#18794e;--greenbg:#eaf7ef;--amber:#925b00;--amberbg:#fff4dc;--red:#b42318;--redbg:#fff0ef;--shadow:0 8px 24px rgba(20,48,90,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:9px;padding:0 12px;font-weight:800;font-size:20px;color:var(--navy);letter-spacing:-.6px}.brandmark{width:24px;height:24px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#53647b;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:600}.nav button.active{background:var(--blue2);color:var(--blue)}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;display:grid;gap:6px}.sidefoot button{border:0;background:transparent;color:#64748b;text-align:left;padding:10px 12px;border-radius:9px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}.company strong{display:block;font-size:14px}.company span{font-size:12px;color:var(--muted)}.profile{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;background:var(--blue);border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700}.content{max-width:1400px;margin:auto;padding:28px 32px 40px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}.pagehead h1{font-size:28px;letter-spacing:-.7px;margin:4px 0 5px}.sub{color:var(--muted);margin:0}.datepill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:#52637a;font-size:12px;white-space:nowrap}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}.metriclabel{font-size:12px;color:var(--muted);font-weight:600}.metricvalue{font-size:27px;font-weight:800;letter-spacing:-.7px;margin:8px 0 4px}.hint{font-size:12px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--amber)}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.pill.red{background:var(--redbg);color:var(--red)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.blue{background:var(--blue2);color:var(--blue)}.cols{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 15px;font-size:16px}.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:700}.chartwrap{height:245px;width:100%;position:relative}.chartwrap svg{width:100%;height:100%;overflow:visible}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:10px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.ops{display:grid;gap:0}.op{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #eef2f7}.op:last-child{border-bottom:0}.opdate{font-size:11px;color:var(--muted)}.opname{font-weight:650;font-size:13px}.optype{font-size:11px;color:var(--muted)}.amount{font-weight:750;font-size:13px;white-space:nowrap}.alertbox{background:var(--redbg);border:1px solid #f7d2cf;border-radius:13px;padding:16px;margin-bottom:14px}.alertbox strong{display:block;color:var(--red);font-size:16px;margin:7px 0 4px}.alertbox p{color:#7b3835;font-size:12px;margin:0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;background:var(--blue);color:#fff;box-shadow:0 3px 8px #1769e026}.btn:hover{background:#0d57c7}.btn.secondary{background:#fff;color:var(--blue);border:1px solid #d6e4fa;box-shadow:none}.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;padding:12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid #eef2f7;font-size:12px}tr:last-child td{border-bottom:0}.tablecard{margin-top:16px}.riskcard{border-color:#f3d5d3}.risknumber{font-size:32px;font-weight:850;color:var(--red);letter-spacing:-1px}.cause{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eef2f7}.cause:last-child{border:0}.number{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:var(--blue2);color:var(--blue);font-weight:800;font-size:11px;flex-shrink:0}.cause strong{display:block;font-size:12px}.cause span{font-size:12px;color:var(--muted)}.scenariohead{display:flex;align-items:center;gap:10px;margin-bottom:16px}.scenariohead .swatch{width:10px;height:10px;border-radius:3px}.scenariohead strong{font-size:14px}.scenarioresult{font-size:30px;font-weight:850;letter-spacing:-.7px;margin:8px 0 4px}.scenario-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scenario{border-top:4px solid var(--red)}.scenario.good{border-top-color:var(--green)}.scenario.good .scenarioresult{color:var(--green)}.scenario .scenarioresult{color:var(--red)}.controlrow{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:center;margin:16px 0}.controlrow label{font-weight:700;font-size:13px}.controlrow small{display:block;color:var(--muted);font-weight:400;margin-top:4px}.controlrow input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff}.note{padding:12px 14px;background:#f6f9fe;border-radius:10px;color:#53647b;font-size:12px}.assistant-layout{grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr)}.chatmsg{padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff}.chatmsg.ai{background:#f7faff;border-color:#dce9ff}.chatmsg strong{display:block;font-size:13px;margin-bottom:7px}.chatmsg p{margin:0;color:#4e6078;font-size:13px}.chatinput{display:flex;gap:8px;margin-top:14px}.chatinput input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px}.chatinput button{width:44px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:18px}.recommend{padding:14px 0;border-bottom:1px solid #eef2f7}.recommend:last-child{border-bottom:0}.recommend strong{font-size:13px;display:block;margin-bottom:4px}.recommend p{font-size:12px;color:var(--muted);margin:0}.footnote{font-size:11px;color:var(--muted);margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#102d57;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;max-width:340px;z-index:20}.mobilemenu{display:none}
@media(max-width:1050px){.app{grid-template-columns:185px 1fr}.sidebar{padding:20px 10px}.content{padding:24px 20px}.topbar{padding:0 20px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.assistant-layout{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{display:none}.topbar{height:64px;padding:0 14px}.company span{display:none}.profile .person{display:none}.content{padding:20px 14px}.pagehead{display:block}.datepill{display:inline-block;margin-top:12px}.pagehead h1{font-size:24px}.metrics{gap:10px}.card{padding:15px}.metricvalue{font-size:23px}.cols,.scenario-grid{grid-template-columns:1fr}.mobilemenu{display:flex;gap:6px;padding:10px 12px;overflow:auto;background:#fff;border-bottom:1px solid var(--line)}.mobilemenu button{white-space:nowrap;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;color:#52637a;font-size:12px}.mobilemenu button.active{background:var(--blue2);color:var(--blue);border-color:#d7e5ff}.controlrow{grid-template-columns:1fr 110px}.chartwrap{height:210px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="brandmark">↗</span> ВТБ.Оракул</div>
  <nav class="nav" id="nav">
    <button class="active" data-screen="home"><span class="ico">⌂</span>Главная</button>
    <button data-screen="forecast"><span class="ico">⌁</span>Прогноз</button>
    <button data-screen="scenarios"><span class="ico">⇄</span>Сценарии</button>
    <button data-screen="assistant"><span class="ico">✳</span>AI-помощник</button>
  </nav>
  <div class="sidefoot"><button>⚙ Настройки</button><button>ⓘ Помощь</button><button>↪ Выйти</button></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="company"><strong>ООО «Альфа» ▾</strong><span>Торговля · демонстрационный профиль</span></div>
    <div class="profile"><span>♧</span><div class="avatar">АИ</div><div class="person"><strong>Алексей Иванов</strong><br><span style="color:#6c7b91;font-size:11px">Владелец бизнеса</span></div><span>⌄</span></div>
  </header>
  <div class="mobilemenu" id="mobilenav">
    <button class="active" data-screen="home">Главная</button><button data-screen="forecast">Прогноз</button><button data-screen="scenarios">Сценарии</button><button data-screen="assistant">AI-помощник</button>
  </div>
  <div class="content" id="content"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const state={screen:"home",purchaseShift:60000};
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n).replace(/\u00a0/g,' ')+' ₽';
const signed=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const money=n=>fmt(n);
function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2600)}
function navTo(s){state.screen=s;document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===s));render()}
function baseline(){return [
 {date:'24 окт.',full:'24.10.2026',name:'Начальный остаток',amount:250000,type:'start'},
 {date:'25 окт.',full:'25.10.2026',name:'Оплата поставщику',amount:-160000,type:'pay'},
 {date:'27 окт.',full:'27.10.2026',name:'Поступление от клиента',amount:180000,type:'in'},
 {date:'29 окт.',full:'29.10.2026',name:'Закупка товаров',amount:-210000,type:'pay'},
 {date:'31 окт.',full:'31.10.2026',name:'Обязательный платёж',amount:-90000,type:'pay'},
 {date:'5 нояб.',full:'05.11.2026',name:'Поступление от клиента',amount:100000,type:'in'}
]}
function scenarioEvents(){return [
 {date:'24 окт.',full:'24.10.2026',name:'Начальный остаток',amount:250000,type:'start'},
 {date:'25 окт.',full:'25.10.2026',name:'Оплата поставщику',amount:-160000,type:'pay'},
 {date:'27 окт.',full:'27.10.2026',name:'Поступление от клиента',amount:180000,type:'in'},
 {date:'29 окт.',full:'29.10.2026',name:'Закупка товаров — первая часть',amount:-(210000-state.purchaseShift),type:'pay'},
 {date:'31 окт.',full:'31.10.2026',name:'Обязательный платёж',amount:-90000,type:'pay'},
 {date:'5 нояб.',full:'05.11.2026',name:'Поступление от клиента',amount:100000,type:'in'},
 {date:'7 нояб.',full:'07.11.2026',name:'Перенесённая часть закупки',amount:-state.purchaseShift,type:'pay'}
]}
function calc(events){let b=0;return events.map((e,i)=>{if(i===0)b=e.amount;else b+=e.amount;return {...e,balance:b}})}
function data(scenario=false){const ev=scenario?scenarioEvents():baseline();return calc(ev)}
function minBalance(rows){return Math.min(...rows.slice(1).map(x=>x.balance))}
function dateOfMin(rows){const m=minBalance(rows);return rows.find((x,i)=>i>0&&x.balance===m)?.date||'—'}
function chart(rows,scenario=false){const W=660,H=235,L=52,R=15,T=18,B=34,iw=W-L-R,ih=H-T-B;const vals=rows.map(x=>x.balance);const min=Math.min(-60000,...vals)-20000,max=Math.max(300000,...vals)+20000;const x=i=>L+i*iw/(rows.length-1),y=v=>T+(max-v)/(max-min)*ih,zero=y(0);let grid='';[-50000,0,100000,200000,300000].forEach(v=>{if(v>=min&&v<=max){grid+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="${v===0?'#d95d59':'#edf1f6'}" stroke-width="${v===0?1.8:1}" ${v===0?'stroke-dasharray="5 4"':''}/><text x="${L-8}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#8a98ab">${v===0?'0':(v/1000)+'k'}</text>`}});let path='';rows.forEach((r,i)=>path+=(i?' L':'M')+x(i)+' '+y(r.balance));let area=path+` L ${x(rows.length-1)} ${zero} L ${x(0)} ${zero} Z`;let dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.balance)}" r="${r.balance<0?5:3.5}" fill="${r.balance<0?'#c83c36':'#1769e0'}" stroke="#fff" stroke-width="2"/>`).join('');let labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="#7b899d">${r.date}</text>`).join('');let negativePath='';let inNeg=false;rows.forEach((r,i)=>{if(r.balance<0){negativePath+=(inNeg?' L':'M')+x(i)+' '+y(r.balance);inNeg=true}else{inNeg=false}});return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График прогнозного остатка по датам">${grid}<path d="${area}" fill="#1769e0" opacity=".06"/><path d="${path}" fill="none" stroke="#1769e0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${negativePath?`<path d="${negativePath}" fill="none" stroke="#c83c36" stroke-width="3.5" stroke-linecap="round"/>`:''}${dots}${labels}</svg>`}
function opsTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Дата</th><th>Операция</th><th>Сумма</th><th>Остаток после операции</th></tr></thead><tbody>${rows.slice(1).map(r=>`<tr><td>${r.full}</td><td>${r.name}</td><td class="amount ${r.amount<0?'negative':r.amount>0?'positive':''}">${signed(r.amount)}</td><td class="amount ${r.balance<0?'negative':r.balance>0?'positive':''}">${signed(r.balance)}</td></tr>`).join('')}</tbody></table></div>`}
function shell(title,sub){return `<div class="pagehead"><div><div class="eyebrow">ВТБ.ОРАКУЛ · ФИНАНСЫ БИЗНЕСА</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="datepill">◷ 24 октября 2026 · Прогноз на 14 дней</div></div>`}
function home(){const rows=data(),mn=minBalance(rows);return shell('Добрый день, Алексей!','Вот текущая ситуация в вашем бизнесе.')+`
<div class="grid metrics">
 <div class="card"><div class="metriclabel">Текущий остаток</div><div class="metricvalue">${money(250000)}</div><div class="hint">На начало прогноза</div></div>
 <div class="card"><div class="metriclabel">Статус прогноза</div><div style="margin:9px 0"><span class="pill red">● Риск дефицита</span></div><div style="font-size:13px;font-weight:750">31 октября</div><div class="hint">Ожидаемый дефицит ${money(30000)}</div></div>
 <div class="card"><div class="metriclabel">Ожидаемые поступления</div><div class="metricvalue positive">${signed(280000)}</div><div class="hint">2 ожидаемых поступления</div></div>
 <div class="card"><div class="metriclabel">Планируемые платежи</div><div class="metricvalue">${signed(-460000)}</div><div class="hint">3 плановых платежа</div></div>
</div>
<div class="grid cols">
 <section class="card"><h2 class="sectiontitle">Динамика остатка <button class="linkbtn" onclick="navTo('forecast')">Подробный прогноз →</button></h2><div class="chartwrap">${chart(rows)}</div><div class="legend"><span><i class="dot" style="background:#1769e0"></i>Прогноз остатка</span><span><i class="dot" style="background:#c83c36"></i>Отрицательный остаток</span><span>— — Нулевой остаток</span></div></section>
 <section class="card"><h2 class="sectiontitle">Ближайшие операции <button class="linkbtn" onclick="navTo('forecast')">Все операции</button></h2><div class="ops">${rows.slice(1,5).map(r=>`<div class="op"><div class="opdate">${r.date}</div><div><div class="opname">${r.name}</div><div class="optype">${r.type==='in'?'Поступление':'Платёж'}</div></div><div class="amount ${r.amount<0?'negative':'positive'}">${signed(r.amount)}</div></div>`).join('')}</div><div class="btnrow"><button class="btn" onclick="navTo('forecast')">Посмотреть прогноз</button></div></section>
</div><p class="footnote">Демонстрационный макет. Все данные условные; прогноз не является банковской услугой или финансовой рекомендацией.</p>`}
function forecast(){const rows=data();return shell('Прогноз денежных потоков','Проверьте, как меняется остаток на счёте и какие операции создают риск.')+`
<div class="grid cols">
 <section class="card"><h2 class="sectiontitle">Прогноз остатка на счёте <span class="pill blue">14 дней</span></h2><div class="chartwrap">${chart(rows)}</div><div class="legend"><span><i class="dot" style="background:#1769e0"></i>Прогноз остатка</span><span><i class="dot" style="background:#c83c36"></i>Дефицит</span><span>— — Нулевой остаток</span></div><div class="note" style="margin-top:14px">Расчёт основан на введённых суммах и датах операций. Изменение фактических сроков поступлений или платежей изменит прогноз.</div></section>
 <section class="card riskcard"><span class="pill red">● Высокий риск</span><div class="metriclabel" style="margin-top:14px">Прогнозный дефицит</div><div class="risknumber">${money(30000)}</div><div style="font-weight:750;margin:4px 0 15px">Возможен 31 октября 2026</div><h3 class="sectiontitle">Основные причины</h3><div class="cause"><div class="number">1</div><div><strong>Закупка товаров · 29 октября</strong><span>−210 000 ₽</span></div></div><div class="cause"><div class="number">2</div><div><strong>Обязательный платёж · 31 октября</strong><span>−90 000 ₽</span></div></div><div class="btnrow"><button class="btn" onclick="navTo('scenarios')">Сравнить сценарии</button></div></section>
</div>
<section class="card tablecard"><h2 class="sectiontitle">Планируемые операции</h2>${opsTable(rows)}</section>
<p class="footnote">Демонстрационный расчёт. Поступление 5 ноября на 100 000 ₽ учтено в горизонте прогноза.</p>`}
function scenarios(){const base=data(),alt=data(true),minA=minBalance(alt),end=alt[alt.length-1].balance;return shell('Сценарии решения','Измените параметры операции и сравните прогноз до и после изменения.')+`
<div class="grid scenario-grid">
 <section class="card scenario"><div class="scenariohead"><i class="swatch" style="background:#c83c36"></i><strong>Исходный сценарий</strong><span class="pill red" style="margin-left:auto">Дефицит</span></div><div class="metriclabel">Минимальный остаток</div><div class="scenarioresult">${signed(minBalance(base))}</div><div class="hint">31 октября 2026</div><div class="chartwrap" style="height:195px;margin-top:12px">${chart(base)}</div><div class="note">Закупка 210 000 ₽ оплачивается 29 октября полностью.</div></section>
 <section class="card scenario good"><div class="scenariohead"><i class="swatch" style="background:#18794e"></i><strong>Альтернативный сценарий</strong><span class="pill green" style="margin-left:auto">Положительный остаток</span></div><div class="metriclabel">Минимальный остаток</div><div class="scenarioresult">${signed(minA)}</div><div class="hint">До 6 ноября 2026</div><div class="chartwrap" style="height:195px;margin-top:12px">${chart(alt,true)}</div><div class="note">Перенос части закупки на 7 ноября повышает минимальный остаток в октябре.</div></section>
</div>
<section class="card tablecard"><h2 class="sectiontitle">Настройка альтернативного сценария</h2><div class="controlrow"><div><label for="shift">Сумма закупки, переносимая на 7 ноября</label><small>Из общей закупки 210 000 ₽. Обязательство не исчезает.</small></div><input id="shift" type="number" min="0" max="210000" step="10000" value="${state.purchaseShift}"></div><div class="note" id="scenarioNote">При переносе ${money(state.purchaseShift)} ₽ минимальный остаток до 6 ноября составит ${signed(minA)}. Остаток после платежа 7 ноября: ${signed(end)}.</div><div class="btnrow"><button class="btn" id="applyScenario">Пересчитать сценарий</button><button class="btn secondary" onclick="navTo('assistant')">Обсудить с AI-помощником</button></div></section>
<section class="card tablecard"><h2 class="sectiontitle">Операции альтернативного сценария</h2>${opsTable(alt)}</section>
<p class="footnote">Перенос платежа показан только как моделирование. Перед реальным решением необходимо проверить условия договора и влияние на поставки.</p>`}
function assistant(){return shell('AI-помощник','Объяснение риска и варианты следующих действий.')+`
<div class="grid assistant-layout">
 <section class="card"><h2 class="sectiontitle">Разбор ситуации</h2>
 <div class="chatmsg ai"><strong>✳ ВТБ.Оракул · Анализ</strong><p>По заданным демонстрационным данным прогнозируется отрицательный остаток 31 октября: −30 000 ₽. Основные факторы — закупка товаров на 210 000 ₽ 29 октября и обязательный платёж на 90 000 ₽ 31 октября.</p></div>
 <div class="chatmsg"><strong>Почему возникает дефицит?</strong><p>После оплаты поставщику 25 октября остаток составит 90 000 ₽. Поступление 27 октября увеличит его до 270 000 ₽, но закупка и обязательный платёж превышают доступную сумму до следующего поступления.</p></div>
 <div class="chatmsg ai"><strong>Рекомендуемый сценарий для проверки</strong><p>Рассмотрите перенос части закупки на 7 ноября, если это допускает договор и не нарушает работу бизнеса. При переносе 60 000 ₽ минимальный остаток до 6 ноября составит +30 000 ₽. Поступление 5 ноября и перенесённый платёж учтены отдельно.</p></div>
 <div class="chatinput"><input id="question" placeholder="Например: что будет, если поступление задержится?"><button id="ask" aria-label="Отправить вопрос">➤</button></div><div class="hint" style="margin-top:8px">В демонстрационном прототипе ответы ограничены подготовленными сценариями.</div>
 </section>
 <aside class="card"><h2 class="sectiontitle">Дополнительные варианты</h2>
 <div class="recommend"><strong>01 · Разделить закупку</strong><p>Сравнить несколько сумм и проверить, сохранится ли положительный остаток.</p><div class="btnrow"><button class="btn secondary" onclick="navTo('scenarios')">Изменить сценарий</button></div></div>
 <div class="recommend"><strong>02 · Уточнить срок поступления</strong><p>Проверить, как изменится прогноз, если ожидаемые 180 000 ₽ поступят позже.</p><div class="btnrow"><button class="btn secondary" onclick="showToast('В следующей итерации добавим настройку задержки поступления.')">Проверить задержку</button></div></div>
 <div class="recommend"><strong>03 · Проверить финансирование</strong><p>Рассматривать банковские инструменты только после оценки условий, стоимости и альтернатив.</p><div class="btnrow"><button class="btn secondary" onclick="showToast('Это демонстрация, подключение банковских продуктов не реализовано.')">Условия и ограничения</button></div></div>
 </aside>
</div><p class="footnote">AI-помощник в этом макете — демонстрация UX-сценария, а не подключённая языковая модель. Все рекомендации требуют проверки пользователем.</p>`}
function render(){const c=document.getElementById('content');c.innerHTML=state.screen==='home'?home():state.screen==='forecast'?forecast():state.screen==='scenarios'?scenarios():assistant();if(state.screen==='scenarios'){document.getElementById('applyScenario').addEventListener('click',()=>{const v=Number(document.getElementById('shift').value);if(!Number.isFinite(v)||v<0||v>210000){showToast('Введите сумму от 0 до 210 000 ₽.');return;}state.purchaseShift=v;render();showToast('Сценарий пересчитан по введённой сумме.');});}if(state.screen==='assistant'){document.getElementById('ask').addEventListener('click',answer);document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});}}
function answer(){const i=document.getElementById('question'),q=i.value.trim();if(!q)return;const lower=q.toLowerCase();let ans='Для ответа нужно изменить исходные данные и пересчитать сценарий. В этом прототипе доступны прогноз, сравнение закупки и объяснение причин дефицита.';if(lower.includes('задерж')||lower.includes('позже'))ans='Если поступление 180 000 ₽ задержится, риск может стать выше. Для точного ответа нужно изменить дату поступления и пересчитать остаток по дням. Эта функция пока обозначена как следующий шаг прототипа.';else if(lower.includes('закуп')||lower.includes('перенос'))ans='В разделе «Сценарии» можно изменить сумму закупки, переносимую на 7 ноября. Макет пересчитает остатки с учётом перенесённого обязательства.';else if(lower.includes('почему')||lower.includes('причин'))ans='Риск формируют закупка на 210 000 ₽ 29 октября и обязательный платёж на 90 000 ₽ 31 октября при текущем остатке и заданных поступлениях.';const box=document.createElement('div');box.className='chatmsg';box.innerHTML='<strong>Ваш вопрос</strong><p></p>';box.querySelector('p').textContent=q;const c=document.querySelector('.assistant-layout .card');c.insertBefore(box,document.querySelector('.chatinput'));const response=document.createElement('div');response.className='chatmsg ai';response.innerHTML='<strong>✳ ВТБ.Оракул</strong><p></p>';response.querySelector('p').textContent=ans;c.insertBefore(response,document.querySelector('.chatinput'));i.value=''}
document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.screen)));
render();
</script>
</body>
</html>
